; ============================================================================
;  ESP32 Wi-Fi <-> Ethernet Bridge  -  PlatformIO project configuration
; ============================================================================
;
;  Pure ESP-IDF build (framework = espidf), NO Arduino.
;
;  Why no Arduino:
;   - The code only uses IDF APIs anyway (esp_eth, esp_wifi, esp_netif,
;     esp_http_server, mqtt_client). Arduino only contributed millis(),
;     delay(), Serial and pinMode - all replaced in compat.h or directly.
;   - The Arduino component unavoidably pulls in RainMaker and Insights via
;     the IDF Component Manager. They are never used, cost flash and caused
;     a string of build failures in the dual-framework setup (missing
;     certificates, missing esp_crt_bundle.h).
;   - The Arduino core alone weighs about 300 kB of flash.
;
;  Project layout:
;     platformio.ini
;     partitions_8mb_ota.csv
;     sdkconfig.defaults
;     CMakeLists.txt
;     src/CMakeLists.txt
;     src/*.cpp, src/*.h
; ============================================================================

[env:wt32-eth01]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board     = esp32dev
framework = espidf

board_build.f_cpu       = 240000000L
board_build.flash_mode  = dio
; Flash clock 80 MHz instead of 40. This is the only real speed lever this
; board has: the CPU is already at its 240 MHz maximum (the ESP32 only offers
; 80/160/240), but at 40 MHz the flash would run at half its possible
; bandwidth. Since practically all code except the IRAM paths is fetched from
; flash through the cache, this affects every cache miss - i.e. latency and
; throughput. 80 MHz DIO is the normal case for ESP32 modules, not an edge
; case.
board_build.f_flash     = 80000000L
; The board has 8 MB of flash (esptool flash-id reports Zbit 0x5E / 0x4017,
; capacity byte 0x17 = 8 MiB, confirmed by an aliasing test against
; 0x401000). See partitions_8mb_ota.csv.
;
; BOTH lines are required, they control different things:
;   board_build.flash_size  -> CONFIG_ESPTOOLPY_FLASHSIZE (what IDF believes)
;   board_upload.flash_size -> the size nibble in the image header that
;                              esptool writes (what the hardware acts on)
; Without the second line the header silently inherits 4 MB from the
; esp32dev board manifest, and the board would never see half of the chip.
; Direction of failure: esp_flash_init_default_chip() only aborts when the
; detected size is SMALLER than the header (header too large = hard error).
; A header smaller than the chip is only a warning and merely wastes
; capacity.
board_build.flash_size  = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions  = partitions_8mb_ota.csv

; Writes src/build_info.h with the current git revision before every build -
; so /api/status reports which commit is running, and a coredump found later
; can be matched to an entry in elf_archive/ (see scripts/gen_build_info.py
; and scripts/ota_flash.sh).
extra_scripts = pre:scripts/gen_build_info.py

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; Deliberately conservative. A USB-serial adapter on loose jumper wires can
; abort an esptool read-flash at 460800 ("Packet content transfer stopped")
; while the same operation works cleanly at 115200. For faster flashing,
; raise it step by step and keep the wiring short - an abort here is not a
; hardware defect but signal quality.
upload_speed = 115200

build_flags =
    -Os

; ============================================================================
;  NiceMCU ESP32-C5_MINI_V1.0 + W5500 on SPI
; ============================================================================
;  Same sources as wt32-eth01. Target differences are compile-time switches
;  in the code (CONFIG_ETH_SPI_ETHERNET_W5500, CONFIG_SOC_WIFI_SUPPORT_5G,
;  CONFIG_IDF_TARGET_ESP32C5, CONFIG_IDF_TARGET_ARCH_XTENSA) plus
;  sdkconfig.defaults.esp32c5, which ESP-IDF loads on top of
;  sdkconfig.defaults automatically for this target.
;
;  Wiring W5500 -> NiceMCU (see the pin block in bridge.cpp):
;     SCLK -> IO9    MOSI -> IO8    MISO -> IO2    SCS -> IO10
;     INT  -> IO15   RST  -> IO3
;     3V3  -> 3V3    GND  -> GND
;  Factory reset: hold IO4 to GND for 2 s at boot.
;
;  Board: ESP32-C5HF4 = 4 MB in-package flash, no PSRAM, native USB
;  (USB-Serial/JTAG on the USB-C connector, no separate USB-UART chip). The
;  console runs on that USB port only; a serial monitor must assert DTR, or
;  the port delivers no output.
[env:nicemcu-c5-w5500]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board     = esp32-c5-devkitc1-n4
framework = espidf

board_build.f_cpu       = 240000000L
board_build.flash_mode  = dio
board_build.f_flash     = 80000000L
; Same two-place rule as for wt32-eth01: IDF Kconfig vs. the size nibble in
; the image header. The Kconfig side is pinned in sdkconfig.defaults.esp32c5.
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions  = partitions_4mb_ota.csv

; idf_sct_backport.py enables the SPI master's segmented transfer mode (SCT)
; for the C5 in the IDF 5.5 framework package - the W5500 RX chain uses it.
extra_scripts =
    pre:scripts/gen_build_info.py
    pre:scripts/idf_sct_backport.py

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
; Native USB: the baud rate is irrelevant there, transfers run at USB speed.
upload_speed = 921600

build_flags =
    -Os
