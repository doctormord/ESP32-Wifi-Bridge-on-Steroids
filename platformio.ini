; ============================================================================
;  ESP32 Wi-Fi <-> Ethernet Bridge  -  PlatformIO Projektkonfiguration
; ============================================================================
;
;  Reiner ESP-IDF-Build (framework = espidf), KEIN Arduino.
;
;  Warum kein Arduino mehr:
;   - Der Code benutzt ohnehin nur IDF-APIs (esp_eth, esp_wifi, esp_netif,
;     esp_http_server, mqtt_client). Von Arduino kamen nur millis(), delay(),
;     Serial und pinMode - alles in compat.h bzw. direkt ersetzt.
;   - Die Arduino-Komponente zieht ueber den IDF Component Manager zwingend
;     RainMaker und Insights mit. Die brauchen wir nie, sie kosten Flash und
;     haben in der Dual-Framework-Variante reihenweise Build-Fehler erzeugt
;     (fehlende Zertifikate, fehlendes esp_crt_bundle.h).
;   - Der Arduino-Core allein wiegt rund 300 kB. Bei 960 kB pro OTA-Slot ist
;     das der Unterschied zwischen "passt nicht" und "reichlich Luft".
;
;  Projektstruktur:
;     platformio.ini
;     partitions_2mb_ota.csv
;     sdkconfig.defaults
;     CMakeLists.txt
;     src/CMakeLists.txt
;     src/*.cpp, src/*.h
; ============================================================================

[env:wt32-eth01]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board     = esp32dev
framework = espidf

board_build.f_cpu       = 240000000L
board_build.flash_mode  = dio
; Flash-Takt von 40 auf 80 MHz. Das ist der einzige echte "Uebertaktungs"-
; Hebel, den dieses Board hat: die CPU steht mit 240 MHz bereits am Anschlag
; (der ESP32 kennt nur 80/160/240, alles darueber ist nicht vorgesehen), aber
; der Flash lief bisher mit der halben moeglichen Bandbreite. Da praktisch
; aller Code ausser den IRAM-Pfaden per Cache aus dem Flash geholt wird,
; wirkt sich das auf jeden Cache-Miss aus - also auf Latenz und Durchsatz.
; 80 MHz DIO ist fuer ESP32-Module der Normalfall, kein Grenzbetrieb.
board_build.f_flash     = 80000000L
; Das Board hat 8 MB Flash. Die urspruengliche Projektnotiz sprach von 2 MB;
; am 2026-08-13 direkt am Chip nachgemessen (esptool flash-id meldet Zbit
; 0x5E / 0x4017, Kapazitaetsbyte 0x17 = 8 MiB, bestaetigt durch einen
; Aliasing-Test gegen 0x401000). Siehe partitions_8mb_ota.csv.
;
; BEIDE Zeilen sind noetig, sie steuern verschiedene Dinge:
;   board_build.flash_size  -> CONFIG_ESPTOOLPY_FLASHSIZE (was die IDF denkt)
;   board_upload.flash_size -> das Groessen-Nibble im Image-Header, das
;                              esptool schreibt (was die Hardware glaubt)
; Ohne die zweite Zeile erbt der Header stillschweigend die 4 MB aus dem
; esp32dev-Board-Manifest, und das Board wuerde die Haelfte des Chips nie
; sehen. Zur Fehlerrichtung: esp_flash_init_default_chip() bricht nur ab,
; wenn die erkannte Groesse KLEINER ist als der Header (Header zu gross =
; harter Fehler). Header kleiner als der Chip ist dagegen nur eine Warnung
; und kostet lediglich Kapazitaet.
board_build.flash_size  = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions  = partitions_8mb_ota.csv

; Schreibt vor jedem Build src/build_info.h mit dem aktuellen Git-Stand -
; damit /api/status meldet, welcher Commit laeuft, und ein spaeter
; gefundener Coredump sich einem Eintrag in elf_archive/ zuordnen laesst
; (siehe scripts/gen_build_info.py und scripts/ota_flash.sh).
extra_scripts = pre:scripts/gen_build_info.py

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; Bewusst konservativ. Der verwendete CH340 an fliegenden Jumperkabeln hat
; schon bei einem esptool-read-flash mit 460800 abgebrochen ("Packet content
; transfer stopped"), bei 115200 lief derselbe Zugriff sauber. 921600 war
; reines Wunschdenken. Wer kuerzere Flashzeiten will: schrittweise erhoehen
; und dabei die Verkabelung kurz halten - ein Abbruch hier ist kein
; Hardwaredefekt, sondern Signalqualitaet.
upload_speed = 115200

build_flags =
    -Os
